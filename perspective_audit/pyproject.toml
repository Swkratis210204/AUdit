[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "perspective-audit"
version = "1.0.0"
readme = "README.md"
description = "A-posteriori unimodality (AU) of annotator subgroups, built on the normalized distance from unimodality (ndfu)"
requires-python = ">=3.9"
keywords = ["polarization", "annotator disagreement", "LLM", "toxicity", "unimodality", "perspectivism"]
dependencies = [
    "numpy",
    "pandas",
    "scipy>=1.9",
    "ndfu>=0.9.3,<1",
    "tqdm",
]

[project.optional-dependencies]
test = ["pytest"]
plots = ["matplotlib"]         # the figures of eda_figures / save_eda
openai = ["openai"]            # ChatGPT, Mistral, DeepSeek, Ollama (Llama)
gemini = ["google-genai"]
oci = ["oci"]                  # Grok on Oracle OCI
all-models = ["openai", "google-genai", "oci"]

[project.urls]
Homepage = "https://github.com/Swkratis210204/llm-dfu-bias-study"
Documentation = "https://github.com/Swkratis210204/llm-dfu-bias-study#readme"
Repository = "https://github.com/Swkratis210204/llm-dfu-bias-study"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
