[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "polaudit"
version = "1.0.1"
readme = "README.md"
license = {text = "MIT"}
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
description = "An audit framework for LLM alignment with human subgroups, based on polarization"
requires-python = ">=3.9"
keywords = ["polarization", "LLM alignment", "subgroups", "annotator disagreement", "audit", "toxicity", "unimodality", "perspectivism"]
dependencies = [
    "numpy",
    "pandas",
    "scipy>=1.9",
    "ndfu>=0.9.3,<1",
    "tqdm",
]

[project.optional-dependencies]
test = ["pytest"]
plots = ["matplotlib"]         # the figures of eda_figures / save_eda
openai = ["openai"]            # ChatGPT, Mistral, DeepSeek, Ollama (Llama)
gemini = ["google-genai"]
oci = ["oci"]                  # Grok on Oracle OCI
all-models = ["openai", "google-genai", "oci"]

[project.urls]
Homepage = "https://github.com/Swkratis210204/AUdit"
Documentation = "https://github.com/Swkratis210204/AUdit#readme"
Repository = "https://github.com/Swkratis210204/AUdit"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
